# Release json on a version tag: a portable source package plus the BASIC codec
# for udt, uv and jbase.  (mvx is not a target — its runtime provides
# JSONENCODE/JSONDECODE built in, mvx#169.)
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# TAG THE COMMIT BEING RELEASED, NOT THE MERGE THAT BRINGS IT TO MAIN
# (mvx#343, and #44 here).  Merge develop into main as usual, then tag the
# merge's SECOND PARENT -- develop's HEAD:
#
#     git checkout main && git merge develop      # as before
#     git tag 1.5.2 "$(git rev-parse main^2)"     # NOT main
#
# Main only ever receives develop merges, so the two have the SAME TREE and a
# checkout of either is byte-for-byte identical -- the ARTIFACT is unaffected
# whichever you tag.  What differs is what the release can be seen as: only the
# second parent is an ancestor of develop as well as main, and `git describe`
# walks back to the nearest REACHABLE tag, which a merge commit on main is not.
#
# EVERY RELEASE SINCE 1.3.0 IS ON A MERGE COMMIT -- 1.4.0, 1.4.1, 1.5.0 and
# 1.5.1 all have two parents and a "Merge pull request" subject -- so develop
# cannot see any of them:
#
#     git describe --tags --match '[0-9]*' origin/develop  ->  1.3.0-22-g0489250
#
# Twenty-two commits past 1.3.0, while 1.5.1 is the published release.  Four
# releases invisible from the branch they were cut from.
#
# If main ever carries something develop does not -- a hotfix committed there
# directly -- the trees differ and the merge itself is what to tag.  (It never
# has: main's extra commits are all develop merges.)  The `tag-placement` job
# below says when that has changed rather than leaving it to be found later.
name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      # ONE rolling dev tag, moved to the HEAD of develop by the nightly when
      # there is something new.  It builds through THIS workflow rather than
      # a second copy of it, so a dev build is the same artifacts by the same
      # steps as a release -- the only way a dev build is worth having.
      - "dev"
  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write
jobs:
  # A WARNING, NOT A GATE.  A main-only hotfix is a legitimate reason for
  # develop not to see a tag, so this reports to the step summary and lets the
  # release proceed -- and it depends on nothing and nothing depends on it, so
  # it can never hold a release up.  What it buys is that the answer arrives
  # with the release instead of when someone thinks to look, which here would
  # have been four releases ago.
  tag-placement:
    name: develop can see this tag
    runs-on: ubuntu-latest
    # Only for a real version tag: `dev` is a rolling tag that is MEANT to move,
    # and a workflow_dispatch on a branch has no tag to place.
    if: ${{ github.ref_type == 'tag' && github.ref_name != 'dev' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # describe needs the history and the tags
      - name: What develop will call itself
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git fetch --quiet origin develop || {
            echo "no develop branch here; nothing to check" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # WHAT develop WILL REPORT, for the summary.  --match '[0-9]*'
          # because this repo's tags carry no `v` prefix, and without it
          # `describe` would happily return `dev` -- the rolling tag.
          desc="$(git describe --tags --match '[0-9]*' origin/develop 2>/dev/null || echo '(none)')"
          echo "develop describes as \`$desc\`" >> "$GITHUB_STEP_SUMMARY"
          # THE TEST IS REACHABILITY, NOT A STRING COMPARISON, because the
          # question is literally whether develop can see this commit.
          #
          # Matching describe's output against the tag looks equivalent and is
          # not.  mvx's version of this job accepts `"$TAG"|"$TAG"-*`, and
          # mapfield's real bug produced `1.1.0-beta1-3-ge4c7348` from develop
          # while the tag was `1.1.0` -- which MATCHES `1.1.0-*`, so that
          # pattern would have reported "develop can see 1.1.0" on the exact
          # failure it exists to catch (mvx#360).  Any repo tagging
          # X.Y.Z-betaN has the same hole.
          #
          # An exact match has the opposite flaw: develop legitimately moves on
          # after a release merge, and `1.5.2-2-gabc` is develop seeing 1.5.2
          # perfectly well.  --is-ancestor is right in both directions.
          if git merge-base --is-ancestor "$TAG" origin/develop 2>/dev/null; then
              echo "develop can see $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
              echo "::warning title=develop cannot see $TAG::develop describes as '$desc', so builds from it report that and not $TAG. For a develop release the tag belongs on the merge's second parent (git rev-parse main^2) -- see this workflow's header. For a main-only hotfix this is expected."
              {
                echo
                echo "**develop cannot see \`$TAG\`.** Builds from develop will"
                echo "report \`$desc\`. For a develop release the tag belongs on"
                echo "the merge's second parent (\`git rev-parse main^2\`); for a"
                echo "main-only hotfix this is expected."
              } >> "$GITHUB_STEP_SUMMARY"
          fi

  # THE TWO MANIFESTS MUST AGREE WITH EACH OTHER.  It no longer checks them
  # against the TAG, and that is deliberate (mvx#363): all four artifacts are
  # stamped at staging now -- publish-source for the source tarball, udt-build
  # for the udt binary, the account job for uv and jbase -- so the in-tree
  # version is derived, not authoritative, and requiring it to name the tag
  # would block exactly the releases stamping makes correct.
  #
  # mvpkg.json said 1.3.0 through the 1.4.0 and 1.4.1 releases and PKG line 2
  # said "1.3" (#28), which is what the version half of this job was added for.
  # Stamping removes the opportunity rather than guarding it.
  #
  # What stamping CANNOT catch is the two files disagreeing with each other
  # about SYSTEMS -- #38, where PKG still declared an arm mvpkg.json had
  # dropped.  That is tag-independent, it ships in every artifact because both
  # files are copied into all four, and it is why this job still exists.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manifests agree with each other
        run: |
          set -eu
          want=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                   mvpkg.json | head -1)
          [ -n "$want" ] || { echo "::error::mvpkg.json has no version"; exit 1; }
          sh tests/manifest-version.sh "$want"

  source:
    needs: [manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/json
          artifact: json
          title: json
          body: "JSON encode/decode with MAPFIELD projection. Source + udt BASIC codec; indexed by the package registry."
  # needs: [source] — NOT for ordering, but so this job never CREATES the release.
  # Every publish step creates it as a side effect of uploading, so jobs starting
  # together each try to create it: one wins and the losers fail finalize with
  # `Validation Failed: {"code":"already_exists","field":"tag_name"}`, leaving a
  # stray draft release behind for the tag.  That is where the duplicate draft
  # beside every tag comes from, and on mv_package#66 it went further — the job
  # it killed was `source`, which other jobs need, so the release shipped with
  # half its artifacts.  `source` alone creates it; the rest upload into it.
  udt-binary:
    needs: [source]
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/json
          artifact: json

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  # ---- uv and jbase: the same BASIC codec, staged on a hosted runner ---------
  # json's non-mvx side is pure BASIC (JSONDECODE/JSONENCODE, no CallC), so
  # there is nothing to compile and nothing os- or arch-specific: `any-any-le`,
  # built here rather than in a licensed container.
  #
  # udt still goes through udt-build above.  It does not need to either -- that
  # job takes the self-hosted UniData runner to copy three BASIC files -- but
  # changing the shape of an artifact that is already published is a separate
  # change from adding two that are not.
  #
  # AFTER source and ONE AT A TIME: each upload creates the release if it is not
  # there yet, so jobs starting together race and all but one lose with
  # `already_exists` on tag_name, leaving a release that looks complete unless
  # you count the assets (curl-cmd#7).
  account:
    needs: [source]
    strategy:
      max-parallel: 1
      matrix:
        system: [uv, jbase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # JUST THE STAMPER.  This job compiles nothing, so it needs no toolchain
      # -- stamp-manifests.py is standalone Python.  Taken from mvx's `main`,
      # its RELEASED line, which moves when a release merges and not before:
      # the right coupling for a script with no compiler dependency, and the
      # opposite of the default branch.
      - name: Check out the manifest stamper
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          ref: main
          path: .mvx-src
          sparse-checkout: .github/actions/publish-source
          sparse-checkout-cone-mode: false

      - name: Stage the ${{ matrix.system }} codec
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          BASE="json-$VER-${{ matrix.system }}-any-any-le"
          rm -rf dist && mkdir -p dist
          sh build-pkg.sh dist
          # THE TAG IS THE SOURCE OF TRUTH (mvx#363).  mvpkg.json said 1.3.0
          # through the 1.4.0 and 1.4.1 releases and PKG line 2 said "1.3", so
          # every artifact declared a version two releases behind the tag it
          # shipped under (#28).  `source` and `udt-binary` already stamp --
          # publish-source and udt-build both do -- and this was the arm that
          # did not.
          #
          # STAMPED AFTER STAGING, on the staged copy rather than the tree: the
          # artifact is what has to be honest, and leaving the checkout alone
          # keeps this job independent of the order the matrix runs in.
          #
          # `dist` ITSELF, not dist/json: build-pkg.sh stages the contents at
          # the root rather than wrapping them in a directory, so that is where
          # the manifests are.
          #
          # And ASSERTED, because a stamper that silently did nothing would
          # leave exactly the bug it is here to prevent.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            python3 .mvx-src/.github/actions/publish-source/stamp-manifests.py \
              dist "$VER"
            test "$(sed -n 2p dist/PKG)" = "$VER"
          else
            echo "not a tag (${GITHUB_REF_TYPE:-unset} $VER): manifests left as committed"
          fi
          tar czf "$BASE.tar.gz" -C dist .
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the ${{ matrix.system }} asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  mark:
    needs: [source, udt-binary, account]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
