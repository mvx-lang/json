# json — what can be checked without an MV system, on every push and PR.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only (see LICENSE).
#
# WHY THIS EXISTS.  There was no ci.yml at all: release.yml triggers only on a
# tag, so its `manifests` job -- the one that stops a bad manifest shipping --
# first ran when a release was already being cut.  A pull request could not
# tell you the manifests agreed, and one did not: #35 dropped the mvx arm and
# updated mvpkg.json and the README, while PKG line 4 went on declaring
# `mvx udt uv jbase` through a release.
#
# AND THE REAL TEST.  tests/JSON.ESCAPES exercises the codec and prints
# FAILURES=0, and for a while nothing ran it: it needs an account on UniData,
# UniVerse or jBASE, so it was run by hand, which means it was run when someone
# remembered to.  Every case in it comes from a bug that shipped (#25, #27, and
# the em dash printing as `u2014` in MVPKG list), so that was the suite which
# would have caught them, sitting unrun (#40).  The three jobs below run it.
#
# ALL THREE SYSTEMS, one job each, because a codec that is right on one of
# them is not thereby right on the others -- the bugs those cases came from
# were differences in how a platform handles a byte, which is the whole reason
# this package has three arms.  They share one runner -- mv-package-registry's
# mv-package-test action -- so the assertions cannot drift between them, or
# between this package and any other using it.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # THE MANIFESTS MUST AGREE WITH EACH OTHER, which is checkable without a
      # tag.  manifest-version.sh compares both files against the version it is
      # given and compares their systems lists to each other, so handing it the
      # version out of mvpkg.json asserts exactly the drift that shipped: PKG
      # saying something mvpkg.json does not.  The release still checks both
      # against the tag, which is the part only a tag can answer.
      - name: The manifests agree with each other
        run: |
          set -eu
          want=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                   mvpkg.json | head -1)
          if [ -z "$want" ]; then
            echo "::error::mvpkg.json has no version to check against"
            exit 1
          fi
          echo "mvpkg.json declares $want -- checking PKG against it"
          sh tests/manifest-version.sh "$want"

      # The three staging scripts are the only executable code in this repo
      # that is not BASIC, and two of them run outside it (the udt builder and
      # mvx's publish-source copy these manifests).  They are clean today, so
      # this holds that rather than discovering it during a release.
      - name: The shell scripts lint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck
          shellcheck -S warning build-pkg.sh build-udt.sh \
            tests/manifest-version.sh

  # ---- the MV systems: deploy into an account and run the codec's own test ---
  # The package is pure BASIC -- JSONENCODE, JSONDECODE and mapfield's MAPFIELD
  # are three plain FUNCTIONs with no $INCLUDE and nothing native -- so none of
  # these needs a build, only somewhere to compile and CATALOG them.
  #
  # THE ACCOUNT WORK IS NOT HERE, and deliberately.  It started here as
  # .github/mv-escapes.sh and was hoisted into mv-package-registry's
  # mv-package-test action so mapfield could use it without a copy
  # (mv-package-registry#65, #42).  Every difference it hides was paid for in CI
  # runs: CREATE-ACCOUNT and not mkdir on jBASE, only udt being born with a BP,
  # UniVerse's CREATE.FILE asking seven questions with the description answered
  # EMPTY so VOC attribute 1 stays a clean "F", one session per run because
  # UniVerse's licence seats do not come back fast enough for a sequence of
  # short ones.  Those live once now, so a weak assertion has one home.
  #
  # `cases` IS EXACT, not a minimum: a test that quietly loses a case still
  # prints FAILURES=0 and still prints no ok=0, so a minimum would go green on a
  # shrinking suite.  Adding a case to JSON.ESCAPES means raising it.
  #
  # .github/actions/mapfield STAYS, because dependency policy belongs to the
  # consumer: `sources` is a list of paths, so how mapfield reaches .deps is
  # this repo's business -- and pinning it to mapfield's latest STABLE release
  # rather than its develop is a policy only json can state.
  #
  # They do not `need` each other: three separate self-hosted runners, so they
  # run at once, and one platform being broken should not hide the other two.
  jbase:
    name: jbase
    runs-on: [self-hosted, linux, jbase]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mapfield
        with:
          token: ${{ github.token }}
      - uses: mvx-lang/mv-package-registry/.github/actions/setup-jbase@main
      - uses: mvx-lang/mv-package-registry/.github/actions/mv-package-test@main
        with:
          platform: jbase
          sources: .deps/mapfield/BP/MAPFIELD BP/JSONENCODE BP/JSONDECODE
          test: tests/JSON.ESCAPES
          cases: 5

  udt:
    name: udt
    runs-on: [self-hosted, linux, udt]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mapfield
        with:
          token: ${{ github.token }}
      - uses: mvx-lang/mv-package-registry/.github/actions/setup-udt@main
      - uses: mvx-lang/mv-package-registry/.github/actions/mv-package-test@main
        with:
          platform: udt
          sources: .deps/mapfield/BP/MAPFIELD BP/JSONENCODE BP/JSONDECODE
          test: tests/JSON.ESCAPES
          cases: 5

  uv:
    name: uv
    runs-on: [self-hosted, linux, uv]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mapfield
        with:
          token: ${{ github.token }}
      - uses: mvx-lang/mv-package-registry/.github/actions/setup-uv@main
      - uses: mvx-lang/mv-package-registry/.github/actions/mv-package-test@main
        with:
          platform: uv
          sources: .deps/mapfield/BP/MAPFIELD BP/JSONENCODE BP/JSONDECODE
          test: tests/JSON.ESCAPES
          cases: 5

  # ---- the workflows themselves, statically -----------------------------------
  # Ported from mvx's `lint-workflows` and mv-package-registry's, not designed
  # here: those carry the two things about actionlint that are easy to get
  # wrong, and both were reproduced in THIS repo before this was written (#46).
  #
  # WHAT WAS UNCHECKED.  ci.yml's `source` job shellchecks the standalone
  # scripts -- build-pkg.sh, build-udt.sh, tests/manifest-version.sh -- and
  # nothing checked the shell INSIDE the workflows: 3 workflows, 7 `run:`
  # blocks, 101 lines.  That shell resolves a release tag, asserts a tarball's
  # layout and compares manifests, so a mistake in it fails a release rather
  # than a test.  Nor was anything checking the workflows themselves -- a bad
  # expression, a composite step with no `shell:`, a `steps.<id>.outputs` with
  # no such step.  All parse; all fail at run time.
  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # SHELLCHECK MUST BE HERE, AND actionlint WILL NOT SAY SO.  It runs the
      # shell checks only when shellcheck is on PATH and is silent when it is
      # absent -- it simply checks less.  Measured in this repo, planting one
      # unquoted variable in this very file:
      #
      #     shellcheck on PATH    -> SC2086 reported, exit 1
      #     shellcheck off PATH   -> 0 findings,      exit 0
      #
      # So without this step the job passes while checking nothing.  GitHub's
      # images ship shellcheck, so this is about noticing the day one stops.
      - name: "shellcheck is present, so the shell in run: blocks is checked too"
        run: |
          set -eu
          command -v shellcheck >/dev/null || {
            echo "::error::no shellcheck on PATH -- actionlint would skip every"
            echo "::error::run: block silently.  Install it in this job."
            exit 1
          }
          shellcheck --version | sed -n '2p'

      # PINNED, not @latest: a linter that changes under us turns an unrelated
      # push red.  `go install` at a tag also gets module checksum verification
      # from the Go checksum database, which a curl|sh installer does not.
      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -eu
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint" -color
